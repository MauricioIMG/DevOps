services:
  python-api:
    container_name: python_api # Nombre del contenedor
    build:
      context: ./python_api # Construye la imagen desde la carpeta python_api
    environment:
      - MONGODB_HOST=mongodb
      - MONGODB_PORT=27017
      - TZ=UTC
    ports:
      - "8001:8001" # Expone puerto de API
    hostname: python-api
    volumes:
      - ./volumes/logs:/app/python-api/logs/python-api.logs # Ajuste del volumen para logs
    networks:
      - mongodb-net # Conectar a red de MongoDB
    depends_on:
      - mongodb
    entrypoint: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001"]
    restart: always
    profiles:
      - api

  api-monitor:
    build:
      context: ./api_monitor
    container_name: api-monitor
    image: python:3.12-slim
    volumes:
      - ./volumes/logs:/api-monitor/logs/api-monitor.log
    environment:
      - TARGET_CONTAINER_HOST=python-api
      - TARGET_CONTAINER_PORT=8001
      - CHECK_INTERVAL=5
      - TZ=America/Bogota
    networks:
      - mongodb-net
    depends_on:
      - python-api
    restart: always
    profiles:
      - monitor

  mongodb:
    container_name: mongodb
    image: mongo:latest
    networks:
      - mongodb-net
    ports:
       - "27017:27017" # Puerto para MongoDB
    hostname: mongodb
    volumes:
      - mongodb-data:/data/db # Volumen persistente para MongoDB
    restart: always
    profiles:
      - db

networks:
  mongodb-net:
    driver: bridge
    name: mongodb-net

volumes:
  mongodb-data:
    name: mongodb-data
